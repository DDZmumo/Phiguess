services:
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: phiguess
      POSTGRES_USER: phiguess
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phiguess -d phiguess"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 2g
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  api:
    build:
      context: .
      target: server
      args:
        VITE_MULTIPLAYER_ENABLED: ${VITE_MULTIPLAYER_ENABLED:-true}
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://phiguess:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/phiguess
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN}
      TRUST_PROXY: "1"
      ASSET_DIR: /app/storage/assets
      AVATAR_DIR: /app/storage/avatars
      GENERATED_ASSET_DIR: /app/storage/generated
      GENERATED_CACHE_MIB: "512"
    volumes:
      - ./storage/assets:/app/storage/assets:ro
      - avatar_data:/app/storage/avatars
      - generated_artwork:/app/storage/generated
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    mem_limit: 1g
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  caddy:
    build:
      context: .
      target: frontend
      args:
        VITE_MULTIPLAYER_ENABLED: ${VITE_MULTIPLAYER_ENABLED:-true}
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api: {condition: service_healthy}
    mem_limit: 256m
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  avatar_data:
  generated_artwork:
