<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第九章 · EZ 随机抽象样图</title>
<style>
:root{color-scheme:dark;font-family:Inter,"Segoe UI","Microsoft YaHei",sans-serif;color:#edf2f7;background:#10151d}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 85% 0,#28374988,transparent 65%);min-height:100vh}main{max-width:1500px;margin:auto;padding:26px 28px 36px}header{display:flex;justify-content:space-between;gap:20px;align-items:center;border-bottom:1px solid #ffffff18;padding-bottom:18px}h1{font-size:24px;margin:7px 0;font-weight:600;letter-spacing:.03em}.eyebrow{font-size:11px;letter-spacing:.2em;color:#9dc9d4}p{color:#a6b4c4;font-size:13px;line-height:1.65;margin:6px 0}.local{white-space:nowrap;border:1px solid #88bdc744;color:#b5dce5;font-size:11px;padding:7px 12px}.controls{display:flex;align-items:end;flex-wrap:wrap;gap:20px;margin:22px 0}label,.label{display:block;color:#a4b4c5;font-size:12px;margin-bottom:8px}select{font:inherit;font-size:14px;color:#f0f6fa;background:#1c2734;border:1px solid #536576;padding:10px 34px 10px 12px;min-width:280px;border-radius:0}.seeds{display:flex;gap:8px}button{cursor:pointer;font:inherit}button.seed{padding:10px 18px;border:1px solid #475a6d;background:#1a2633;color:#c3d0dc;font-size:13px;transform:skewX(-12deg)}button.seed span{display:block;transform:skewX(12deg)}button.seed[aria-pressed=true]{color:#10232e;background:#b9dfe7;border-color:#b9dfe7}button:focus-visible,select:focus-visible{outline:2px solid #e8f6fb;outline-offset:4px}.status{margin-left:auto;font-size:12px;color:#8fa6bb;max-width:270px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.card{background:#17212c;border:1px solid #ffffff14;min-width:0}.card-head{display:flex;align-items:center;gap:12px;padding:11px 15px}.badge{font-size:19px;font-weight:650;letter-spacing:.06em;min-width:38px}.ez{color:#a1d7ad}.hd{color:#8fcce9}.in{color:#efa3b2}.at{color:#c0b1e7}.caption{font-size:12px;color:#9cb0c2}.image-button{position:relative;display:block;padding:0;width:100%;aspect-ratio:2048/1080;border:0;background:#101721;overflow:hidden}.image-button img{display:block;width:100%;height:100%;object-fit:contain}.image-button:after{content:'点击放大';position:absolute;right:10px;bottom:10px;background:#081018b8;color:#e4eef8;padding:4px 8px;font-size:11px;opacity:0;transition:opacity .15s}.image-button:hover:after,.image-button:focus-visible:after{opacity:1}.meta{display:flex;justify-content:space-between;padding:9px 15px;color:#7f99b1;font-size:11px;gap:10px}.note{margin-top:18px;color:#91a5b9;font-size:12px}.note strong{color:#c5d9e6;font-weight:500}dialog{border:1px solid #64758b;background:#0e141d;padding:0;max-width:96vw;max-height:96vh;width:1400px;color:#e7f1f7}dialog::backdrop{background:#02060cdb}dialog header{padding:12px 18px}dialog img{display:block;width:100%;max-height:82vh;object-fit:contain}dialog button{background:transparent;border:1px solid #61788c;color:#e7f1f7;padding:6px 13px}.error{color:#ffb3c0}footer{margin-top:20px;padding-top:14px;border-top:1px solid #ffffff12;font-size:11px;color:#647e95}@media(min-width:1600px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}main{max-width:2100px}}@media(max-width:620px){main{padding:18px 14px}h1{font-size:20px}.local{display:none}.grid{gap:10px}.card-head{padding:9px}.caption{font-size:10px}.badge{font-size:16px}.meta{padding:7px 9px;font-size:10px;flex-wrap:wrap}.status{margin-left:0}.controls{gap:14px}select{min-width:0;width:100%}.select-wrap{width:100%}}
.random-compare{margin-top:24px;padding-top:16px;border-top:1px solid #ffffff18}.compare-head{display:flex;align-items:center;gap:18px;margin-bottom:12px}.compare-head h2{font-size:16px;font-weight:500;margin:0}.compare-head select{min-width:80px;padding:6px 22px 6px 9px}.compare-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.compare-card{padding:0;border:1px solid #475a6d;background:#17212c;color:#b9cddd;min-width:0}.compare-card[aria-pressed=true]{border-color:#b9dfe7}.compare-card img{width:100%;aspect-ratio:2048/1080;object-fit:contain;display:block}.compare-card span{display:block;padding:8px;font-size:12px}@media(max-width:620px){.compare-grid{grid-template-columns:1fr}.compare-head{flex-wrap:wrap}}
</style></head><body><main>
<header><div><div class="eyebrow">PHIGUESS / CHAPTER 09</div><h1>以 EZ 为基底的随机抽象</h1><p>EZ 原样保留。HD → IN → AT 逐步合并色块、减少细节。切换种子，比较同一首歌的不同结果。</p></div><span class="local">本地样图 · 待确认效果</span></header>
<div class="controls"><div class="select-wrap"><label for="song">第九章曲目</label><select id="song"></select></div><div><span class="label">随机种子</span><div class="seeds" id="seeds"></div></div><div id="status" class="status" role="status">正在准备样图…</div></div>
<div class="grid" id="grid"></div>
<section class="random-compare"><div class="compare-head"><h2>同一难度 · 三组随机结果</h2><select id="compare-level" aria-label="随机对照难度"><option value="hd">HD</option><option value="in">IN</option><option value="at" selected>AT</option></select></div><div class="compare-grid" id="compare-grid"></div></section>
<p class="note"><strong>观察重点：</strong>主色和构图能否帮助辨认？HD、IN、AT 的难度差别是否足够？三组种子是否各有变化？</p>
<footer><span id="summary"></span>所有新图均由对应 EZ 文件计算生成；本页仅作视觉比较。生成时间为本机 CPU 实测，不代表线上服务器耗时。</footer>
</main><dialog id="zoom"><header><span id="zoom-title"></span><button id="close" type="button">关闭 ×</button></header><img id="zoom-image" alt="放大查看样图"></dialog>
<script>
const levels=['ez','hd','in','at'],captions={ez:'原有图片 · 未改动',hd:'保留较多色块',in:'进一步合并轮廓',at:'少量大色块'},grid=document.querySelector('#grid'),status=document.querySelector('#status'),songSelect=document.querySelector('#song'),seeds=document.querySelector('#seeds');
let data,seedIndex=0,revision=0,compareRevision=0;
const compareLevel=document.querySelector('#compare-level'),compareGrid=document.querySelector('#compare-grid');
async function showComparison(song){const stamp=++compareRevision,level=compareLevel.value;try{const images=await Promise.all(song.samples.map(async sample=>{const image=new Image();image.src=sample.variants[level].url;image.alt=level.toUpperCase()+' · 种子 '+sample.seed;await image.decode();return image;}));if(stamp!==compareRevision)return;compareGrid.replaceChildren();images.forEach((image,index)=>{const button=document.createElement('button'),label=document.createElement('span');button.className='compare-card';button.type='button';button.setAttribute('aria-pressed',String(index===seedIndex));label.textContent=['A','B','C'][index]+' · '+song.samples[index].seed+' / '+level.toUpperCase();button.append(image,label);button.onclick=()=>{seedIndex=index;show();};compareGrid.append(button);});}catch{compareGrid.textContent='随机对照加载失败，请刷新。';}}
compareLevel.onchange=()=>showComparison(data.songs[+songSelect.value]);
for(const level of levels){const article=document.createElement('article');article.className='card';article.innerHTML='<div class="card-head"><span class="badge '+level+'">'+level.toUpperCase()+'</span><span class="caption">'+captions[level]+'</span></div><button class="image-button" type="button"><img id="image-'+level+'" alt="'+level.toUpperCase()+' 样图"></button><div class="meta" id="meta-'+level+'"></div>';article.querySelector('button').onclick=()=>{const image=article.querySelector('img');if(!image.src)return;document.querySelector('#zoom-title').textContent=(data.songs[+songSelect.value].displayTitle??data.songs[+songSelect.value].title)+' / '+level.toUpperCase()+(level==='ez'?'':' / '+data.songs[+songSelect.value].samples[seedIndex].seed);document.querySelector('#zoom-image').src=image.src;document.querySelector('#zoom').showModal();};grid.append(article);}
document.querySelector('#close').onclick=()=>document.querySelector('#zoom').close();document.querySelector('#zoom').addEventListener('click',event=>{if(event.target===event.currentTarget)event.currentTarget.close();});
async function show(){const current=++revision,song=data.songs[+songSelect.value],sample=song.samples[seedIndex];showComparison(song);status.textContent='正在切换样图…';for(const [index,b]of [...seeds.children].entries())b.setAttribute('aria-pressed',String(index===seedIndex));
try{const images=await Promise.all(levels.map(async level=>{const image=new Image();image.src=level==='ez'?song.ez:sample.variants[level].url;await image.decode();return image;}));if(current!==revision)return;
levels.forEach((level,i)=>{document.querySelector('#image-'+level).src=images[i].src;const meta=document.querySelector('#meta-'+level);if(level==='ez')meta.textContent='使用原 EZ 文件，未重新编码';else{const v=sample.variants[level];meta.innerHTML='<span>'+v.regions+' 个色块 · '+v.colors+' 色</span><span>SVG gzip '+(v.gzipBytes/1024).toFixed(1)+' KB</span>';}});status.textContent='种子 '+sample.seed+' · 三档合计生成 '+sample.milliseconds+' ms';
}catch{status.textContent='样图加载失败，请刷新页面';status.classList.add('error');}}
fetch('manifest.json').then(r=>{if(!r.ok)throw Error();return r.json();}).then(value=>{data=value;document.querySelector('#summary').textContent='共 '+data.songs.length+' 套曲绘（'+new Set(data.songs.map(s=>s.title)).size+' 首歌曲）× 3 组种子，'+data.songs.length*9+' 张生成样图。';for(const [index,song]of data.songs.entries()){const option=document.createElement('option');option.value=index;option.textContent=song.displayTitle??song.title;songSelect.append(option);}data.songs[0].samples.forEach((sample,index)=>{const button=document.createElement('button');button.className='seed';button.type='button';button.innerHTML='<span>'+['A','B','C'][index]+' · '+sample.seed+'</span>';button.onclick=()=>{seedIndex=index;show();};seeds.append(button);});songSelect.onchange=show;show();}).catch(()=>{status.textContent='无法读取样图目录';status.classList.add('error');});
</script></body></html>
