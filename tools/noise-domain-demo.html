<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Phiguess · 噪域复刻演示</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#06080e;color:#dde2ed;font-family:Arial,"Microsoft YaHei",sans-serif}body{display:flex;flex-direction:column}header{height:66px;display:flex;align-items:center;justify-content:space-between;padding:0 26px;border-bottom:1px solid #ffffff16}h1{font-size:17px;letter-spacing:2px;font-weight:500;margin:0}header span{font-size:12px;color:#7e889d}main{flex:1;min-height:0;position:relative;display:grid;place-items:center;overflow:hidden}canvas{width:100%;height:100%;display:block}footer{padding:18px 26px 22px;background:#0d111b;border-top:1px solid #ffffff16;display:flex;align-items:center;gap:18px;flex-wrap:wrap}button{background:#1c2534;border:1px solid #465269;color:#e6ecf5;padding:9px 16px;cursor:pointer;font:inherit;font-size:13px}button:hover{background:#2a3445}button:focus-visible,input:focus-visible{outline:2px solid #d58b9d;outline-offset:3px}label{display:flex;gap:9px;align-items:center;font-size:13px}#seek{flex:1;min-width:150px;accent-color:#c7778c}#time{font-variant-numeric:tabular-nums;font-size:13px;width:80px}#state{font-size:13px;color:#eab6c6;min-width:130px}#error{position:absolute;color:#ffacb6}small{color:#7e889d;font-size:12px}@media(max-width:650px){header{padding:0 14px}header span{display:none}footer{padding:12px;gap:10px}small{width:100%}}
</style></head><body><header><h1>PHIGUESS / 噪域</h1><span>原生实时绘制 · 独立特效演示</span></header>
<main><canvas id="screen" aria-label="粉区闪烁及红区噪域演示"></canvas><p id="error" role="alert"></p></main>
<footer><button id="play">暂停</button><button id="restart">重播</button><input id="seek" aria-label="演示时间" type="range" min="0" max="13.4" value="0" step="0.016667"><output id="time">0.00s</output><span id="state">粉区 · 未激活</span><label><input id="enabled" type="checkbox" checked>噪域层</label><label><input id="grid" type="checkbox">校验网格</label><button id="frame">下一帧</button><small>悬停红区发光 · 按住增强亮度 · 噪点：HL_Storia</small></footer>
<script type="module" src="/src/noise-domain-demo.ts"></script></body></html>
