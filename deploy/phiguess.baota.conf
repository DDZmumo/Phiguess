# Baota Nginx site: public NAT 10291 -> local 8080.
# Keep upstream pooling confined to this application.
upstream phiguess_backend {
    server 127.0.0.1:3000;
    keepalive 16;
    keepalive_timeout 4s;
    keepalive_requests 500;
}

server {
    listen 8080;
    server_name 211.154.18.252;
    root /opt/phiguess/apps/web/dist;
    index index.html;
    client_max_body_size 4m;
    access_log /www/wwwlogs/phiguess.log;
    error_log /www/wwwlogs/phiguess.error.log;

    location ^~ /api/ {
        proxy_pass http://phiguess_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ^~ /socket.io/ {
        proxy_pass http://phiguess_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 75s;
        proxy_buffering off;
    }
    location ~ /\. {
        deny all;
    }

    # Vite changes these URLs whenever their content changes.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    # These filenames are stable; keep their cache lifetime short.
    location /tutorial/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600";
    }
    location /effects/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600";
    }
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
